name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dopamine:
    name: Build and test dopamine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: |
          nix develop path:. -c bash -euc 'test -z "$(gofmt -l cmd/dopamine internal/dopamine internal/workspace)"'
      - name: Vet
        run: nix develop path:. -c go vet ./cmd/dopamine ./internal/dopamine ./internal/workspace
      - name: Race detector
        run: nix develop path:. -c go test -race ./cmd/dopamine ./internal/dopamine ./internal/workspace
      - name: Build, installer tests and isolated terminal scenarios
        run: nix develop path:. -c make test-dopamine
      - name: Build installable Nix package
        run: nix build path:.#dopamine --no-link -L
