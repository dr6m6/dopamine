name: Bug report
description: Report a reproducible problem in dopamine.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, tmux version, dopamine revision and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use a small demo project where possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove tokens, private paths and conversation content first.
